global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'loadbalancer'
    static_configs:
      - targets: ['loadbalancer-prequal:8080', 'loadbalancer-rr:8080']
    metrics_path: '/metrics'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
