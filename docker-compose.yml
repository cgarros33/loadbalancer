services:
  loadbalancer-prequal:
    build: .
    container_name: lb-prequal
    ports:
      - "8080:8080"
    networks:
      - loadbalancer-net
    environment:
      - BACKEND_SERVER1=server1:80
      - BACKEND_SERVER2=server2:80
      - BACKEND_SERVER3=server3:80
      - BACKEND_SERVER4=server4:80
      - BACKEND_SERVER5=server5:80
      - BACKEND_SERVER6=server6:80
      - BACKEND_SERVER7=server7:80
      - BACKEND_SERVER8=server8:80
      - BACKEND_SERVER9=server9:80
      - BACKEND_SERVER10=server10:80
      - LB_ALGORITHM=prequal
      - QRIF=0.7
      - PROBE_POOL_SIZE=8
      - PROBE_RATE_MULTIPLIER=0.5
    depends_on:
      - server1
      - server2
      - server3
      - server4
      - server5
      - server6
      - server7
      - server8
      - server9
      - server10
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  loadbalancer-rr:
    build: .
    container_name: lb-roundrobin
    ports:
      - "8081:8080"
    networks:
      - loadbalancer-net
    environment:
      - BACKEND_SERVER1=server1:80
      - BACKEND_SERVER2=server2:80
      - BACKEND_SERVER3=server3:80
      - BACKEND_SERVER4=server4:80
      - BACKEND_SERVER5=server5:80
      - BACKEND_SERVER6=server6:80
      - BACKEND_SERVER7=server7:80
      - BACKEND_SERVER8=server8:80
      - BACKEND_SERVER9=server9:80
      - BACKEND_SERVER10=server10:80
      - LB_ALGORITHM=roundrobin
      - QRIF=0.7
      - PROBE_POOL_SIZE=8
      - PROBE_RATE_MULTIPLIER=0.5
    depends_on:
      - server1
      - server2
      - server3
      - server4
      - server5
      - server6
      - server7
      - server8
      - server9
      - server10
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  server1:
    build: ./backend
    container_name: server1
    networks:
      - loadbalancer-net
    environment:
      - SERVER_ID=server1
      - PORT=80
      - ANTAGONIST_BIAS=0.65
      - MEAN_DWELL_MS=2000
      - BASE_SERVICE_MS=60
      - CAPACITY=10
      - DEBUG=0
    cpus: 1.0

  server2:
    build: ./backend
    container_name: server2
    networks:
      - loadbalancer-net
    environment:
